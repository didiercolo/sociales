    <!-- ponytail: self-referencing canonical + og:url set from the real URL.
         A hardcoded canonical would point every SPA route at the homepage and
         deindex the subpages, which is worse than having no canonical at all.
         Upgrade path: prerender per-route <head> if JS-rendered canonicals ever
         prove unreliable for a crawler you care about. -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '');
        var href = location.origin + (path || '/');
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = href;
        document.head.appendChild(link);
        var og = document.createElement('meta');
        og.setAttribute('property', 'og:url');
        og.content = href;
        document.head.appendChild(og);
      })();
    </script>
    
    <!-- Redirection script for GitHub Pages SPA routing -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to refresh the page or register a
      // new history entry.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
